[package]
name = "winadmin-ctl"
version = "1.0.0"
edition = "2021"
description = "WinAdmin control utility"

[[bin]]
name = "winadmin-ctl"
path = "src/main.rs"

[dependencies]
native-windows-gui = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
